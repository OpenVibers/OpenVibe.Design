## ═══════════════════════════════════════════════════════════════
## openvibe.design — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.design.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5090, systemd unit openvibe-design) renders every page and serves
## the theme API proxy; nginx terminates TLS, redirects www → apex, rate-limits the API and sign-in, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for a page rendered for an anonymous visitor;
## private, no-store for a person's theme and everything under /api/me). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=design_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=design_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.design www.openvibe.design;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.design$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.design;

    ssl_certificate     /etc/letsencrypt/live/openvibe.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.design/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.design$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.design;

    ssl_certificate     /etc/letsencrypt/live/openvibe.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.design/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.design.access.log;
    error_log  /var/log/nginx/openvibe.design.error.log;

    # Theme variables and a submission are JSON; 128 KB leaves room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── The theme API: reads, and the two writes it proxies (GET/POST/PUT) ──
    # DELETE, PATCH and everything else never reaches the app.
    location /api/ {
        limit_except GET POST PUT { deny all; }
        limit_req zone=design_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5090;
    }

    # ── Sign-in: GET only ───────────────────────────────────
    # /auth/login, /auth/callback, /auth/me and /auth/logout are all GETs here. The app's POST /auth/logout confirm
    # is defence in depth and is not exposed by nginx; a same-origin navigation signs out directly.
    location /auth/ {
        limit_except GET { deny all; }
        limit_req zone=design_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5090;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5090/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── Pages, discovery, static assets, release.json ──────
    location / {
        proxy_pass http://127.0.0.1:5090;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
